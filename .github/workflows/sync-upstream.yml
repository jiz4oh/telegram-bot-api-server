name: Sync tdlib telegram-bot-api

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update upstream submodule
        run: git submodule update --remote --init source

      - name: Commit upstream update
        run: |
          set -euo pipefail
          if git diff --quiet -- source; then
            echo "Upstream is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          git commit -m "chore: sync telegram bot api upstream"
          git push
          gh workflow run build-and-push.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
