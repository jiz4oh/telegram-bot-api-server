name: Build and Push tdlib telegram-bot-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: telegram-bot-api-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - id: meta
        name: Resolve image metadata
        run: |
          set -euo pipefail
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git -C source rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          repo_name="${GITHUB_REPOSITORY#*/}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo_name,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - id: build_meta
        name: Build metadata
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.build_meta.outputs.date }}
